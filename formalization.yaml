# formalization.yaml v0.4. Replace every TEMPLATE value before submitting.
# Replace a placeholder list with [] only when its adjacent comment permits it;
# lists described as required must remain nonempty.
version: "v0.4"

project:
  name: "Test Formalization of Lemma 6 of the VCCBG paper"
  description: >-
    This is a test check of formalization of one part of the the paper on the complexity  
    of the vertex cover problem on cubic bridgeless graphs (VCCBG). Specifically, Part II
    of the VCCBG paper presents an unconditional deterministic polynomial-time algorithm for
    VCCBG. The formalization here is of one direction of the proof of correctness of the algorihtm. 
    It proves that ``If Algorithm 1 returns Yes, then the given instance of VC − CBG is a
    Yes instance'' (Lemma 6). The formalization strictly follows the paper's structure 
    and first formalizes a novel data structure (represents table) and a novel concept (diminishing hops
    analogous to augmenting paths used for maximum matching), a novel graph-theory result (bridging 
    diminishing hops and minimum vertex cover analogous to the Berge Theorem), and discovers an 
    algorithm that uses diminishing hops to find a minimum vertex cover (analogous to Blossom
    Algorithm using augmenting paths to find maximum matching due to Berge Theorem).
  # Required nonempty list of name strings or mappings with a nonempty name.
  authors:
    - Kunal Relia
  # Required root licence. Keep this in sync with the Apache-2.0 LICENSE file.
  license: "Apache-2.0"
  # Required nonempty list of name strings or mappings with a nonempty name.
  # For a thin wrapper, name people responsible for this submitted wrapper;
  # submission authorization separately covers the underlying formalization.
  responsible_maintainers:
    - Kunal Relia
# Omit repository for an ordinary project: Palomar treats this submitted
# repository as the substantive proof development. If this repository is only
# a thin Comparator wrapper, uncomment and pin the actual formalization in this
# exact shape:
# repository:
#   substantive_formalization:
#     id: "TEMPLATE: owner/repository or https://github.com/owner/repository"
#     revision: "TEMPLATE: full 40-character lowercase commit SHA"

classification:
