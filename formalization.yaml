version: "v0.4"

project:
  name: "Formalization of Theorem 8 of the VCCBG paper"
  description: >-
    This is a formalization of the core part of the paper on the complexity  
    of the vertex cover problem on cubic bridgeless graphs (VCCBG). Specifically, Part II
    of the VCCBG paper presents an unconditional deterministic polynomial-time algorithm for
    VCCBG. The formalization here is of the proof of correctness of the algorithm. 
    It proves the theorem via two lemmas: "If Algorithm 1 returns Yes, then the given instance of VCCBG is a
    Yes instance" (Lemma 6) and "If the given instance of VCCBG is a Yes instance, then Algorithm 1 returns Yes"
    (Lemma 5). The formalization strictly follows the paper's structure: 
    it first formalizes a novel data structure (represents table) and a novel concept (diminishing hops
    analogous to augmenting paths used for maximum matching), a novel graph-theory result (bridging 
    diminishing hops and minimum vertex cover analogous to Berge's Theorem), and discovers an 
    algorithm that uses diminishing hops to find a minimum vertex cover (analogous to the Blossom
    Algorithm using augmenting paths to find a maximum matching due to Berge Theorem).
  authors:
    - Kunal Relia
  license: "Apache-2.0"
  responsible_maintainers:
    - Kunal Relia

