name = "VCCBG_PartII"
version = "0.4.1"
keywords = ["math"]
defaultTargets = ["VCCBGPartII","challenge","solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "VCCBGPartII"

[[lean_lib]]
name = "challenge"
roots = ["challenge"]

[[lean_lib]]
name = "solution"
roots = ["solution"]
